SecRule REQUEST_URI_RAW|ARGS|REQUEST_HEADERS|!REQUEST_HEADERS:Referer|FILES|XML:/* "@rx (?:^|[/;\x5c])\.{2,3}[/;\x5c]"      "id:930110,     phase:2,     block,     capture,     t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,t:cmdLine,     msg:'Path Traversal Attack (/../) or (/.../)',     logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',     tag:'application-multi',     tag:'language-multi',     tag:'platform-multi',     tag:'attack-lfi',     tag:'paranoia-level/1',     tag:'OWASP_CRS',     tag:'OWASP_CRS/ATTACK-LFI',     tag:'capec/1000/255/153/126',     ver:'OWASP_CRS/4.26.0-dev',     severity:'CRITICAL',     multiMatch,     setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',     setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}'"

