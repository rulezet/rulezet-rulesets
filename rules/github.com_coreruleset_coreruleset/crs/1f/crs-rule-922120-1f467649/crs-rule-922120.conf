SecRule MULTIPART_PART_HEADERS "@rx content-transfer-encoding:(.*)"      "id:922120,     phase:2,     block,     capture,     t:none,t:lowercase,     msg:'Content-Transfer-Encoding was deprecated by rfc7578 in 2015 and should not be used',     logdata:'Matched Data: %{TX.0}',     tag:'application-multi',     tag:'language-multi',     tag:'platform-multi',     tag:'attack-multipart-header',     tag:'attack-deprecated-header',     tag:'paranoia-level/1',     tag:'OWASP_CRS',     tag:'OWASP_CRS/MULTIPART-ATTACK',     tag:'capec/272/220',     ver:'OWASP_CRS/4.26.0-dev',     severity:'CRITICAL',     setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Multipart header names can't contain any characters outside of range 33 and 126,
# excluding 58 (':') which is the separator.
# RFC 2045 refers RFC 822 about the header syntax.
# Note: this is in phase:2 because these are headers that come in the body