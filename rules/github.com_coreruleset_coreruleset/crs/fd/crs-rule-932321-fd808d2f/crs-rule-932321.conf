SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* "@rx \r\n.*?\b(?:(?:QUI|STA|RSE)T|NOOP|CAPA)"      "id:932321,     phase:2,     block,     capture,     t:none,t:escapeSeqDecode,     msg:'Remote Command Execution: POP3 Command Execution',     logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',     tag:'application-multi',     tag:'platform-multi',     tag:'attack-rce',     tag:'paranoia-level/3',     tag:'OWASP_CRS',     tag:'OWASP_CRS/ATTACK-RCE',     tag:'capec/137/134',     ver:'OWASP_CRS/4.26.0-dev',     severity:'CRITICAL',     setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',     setvar:'tx.inbound_anomaly_score_pl3=+%{tx.critical_anomaly_score}'"


# =[ Unix shell history invocation ]=
#
# This rule is a stricter sibling of 932330.
# Shell history can also be invoked by providing an absolute position: '!1' or by repeating the last command '!!'.
# The latter might seem harmless as you would expect that it already requires a successful exploitation, but it is a threat in disguise.
#
# Imagine the following requests:
#   GET /?rce=c
#   GET /?rce=!!!!
# The last request will invoke /usr/bin/cc, which is otherwise blocked by 932250.
#
# Neither !1 nor !! is necessarily valid speech, but blocking either of them is much more likely to cause false-positives than 932330.