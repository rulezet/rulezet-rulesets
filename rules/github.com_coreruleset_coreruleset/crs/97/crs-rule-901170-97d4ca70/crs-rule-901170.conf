SecRule &TX:crs_skip_response_analysis "@eq 0"      "id:901170,     phase:1,     pass,     nolog,     tag:'OWASP_CRS',     ver:'OWASP_CRS/4.26.0-dev',     setvar:'tx.crs_skip_response_analysis=0'"

#
# -=[ Initialize internal variables ]=-
#

# Initialize anomaly scoring variables.
# All _score variables start at 0, and are incremented by the various rules
# upon detection of a possible attack.

SecAction      "id:901200,     phase:1,     pass,     t:none,     nolog,     tag:'OWASP_CRS',     ver:'OWASP_CRS/4.26.0-dev',     setvar:'tx.blocking_inbound_anomaly_score=0',     setvar:'tx.detection_inbound_anomaly_score=0',     setvar:'tx.inbound_anomaly_score_pl1=0',     setvar:'tx.inbound_anomaly_score_pl2=0',     setvar:'tx.inbound_anomaly_score_pl3=0',     setvar:'tx.inbound_anomaly_score_pl4=0',     setvar:'tx.sql_injection_score=0',     setvar:'tx.xss_score=0',     setvar:'tx.rfi_score=0',     setvar:'tx.lfi_score=0',     setvar:'tx.rce_score=0',     setvar:'tx.php_injection_score=0',     setvar:'tx.http_violation_score=0',     setvar:'tx.session_fixation_score=0',     setvar:'tx.blocking_outbound_anomaly_score=0',     setvar:'tx.detection_outbound_anomaly_score=0',     setvar:'tx.outbound_anomaly_score_pl1=0',     setvar:'tx.outbound_anomaly_score_pl2=0',     setvar:'tx.outbound_anomaly_score_pl3=0',     setvar:'tx.outbound_anomaly_score_pl4=0',     setvar:'tx.anomaly_score=0'"


#
# -=[ Initialize collections ]=-
#
# Create both Global and IP collections for rules to use.
# Some plugins assume that these two collections have already
# been initialized.
# IP collection is initialized with the IP address concatened with the hashed user agent.

# Disable collection initialization by default (see rule 900130 in crs-setup.conf)
# The creation of the IP and the GLOBAL collection is not being tested as
# of this writing due to limits in ftw and our testing setup.
# Proper testing would involve the checking of a variable in the said collections.