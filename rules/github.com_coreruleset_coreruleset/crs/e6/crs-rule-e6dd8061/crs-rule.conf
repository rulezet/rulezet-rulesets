SecRule TX:2 "@lt %{tx.1}"          "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# The `Request-Range` header is a legacy/non-standard HTTP header that dates back to Netscape
# Navigator 2-3 and MSIE 3 (~1996-1997). It was never part of any HTTP RFC and has no legitimate
# use in modern web traffic.
#
## Background
#
### Origin of `Request-Range`
#
# The header originated from an early draft of HTTP byte-range requests before standardization:
#
# - **Draft standard**: Defined `Request-Range` header with `multipart/x-byteranges` response type
# - **HTTP/1.1 (RFC 2068/7233/9110)**: Standardized as `Range` header with `multipart/byteranges` response type
# - **Netscape Navigator 2-3**: Sent **both** `Range` and `Request-Range` headers (with the same value)
# - **Netscape Communicator 4+**: Dropped the non-standard `Request-Range` header
#
# Rationale for Blocking
#
# | Factor                    | Assessment                                                    |
# |---------------------------|---------------------------------------------------------------|
# | **Legitimate modern use** | None - header is ~25 years obsolete                           |
# | **Last known clients**    | Netscape Navigator 2-3, MSIE 3 (1996-1997)                    |
# | **False positive risk**   | Essentially zero                                              |
# | **Attack surface**        | Servers may still process it; could bypass `Range`-only rules |
# | **RFC status**            | Never standardized; not in RFC 9110                           |