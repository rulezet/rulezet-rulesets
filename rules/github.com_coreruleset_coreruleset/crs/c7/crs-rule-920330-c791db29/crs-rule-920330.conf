SecRule REQUEST_HEADERS:User-Agent "@rx ^$"      "id:920330,     phase:1,     block,     t:none,     msg:'Empty User Agent Header',     tag:'application-multi',     tag:'language-multi',     tag:'platform-multi',     tag:'attack-protocol',     tag:'paranoia-level/1',     tag:'OWASP_CRS',     tag:'OWASP_CRS/PROTOCOL-ENFORCEMENT',     tag:'capec/1000/210/272',     ver:'OWASP_CRS/4.26.0-dev',     severity:'NOTICE',     setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

#
# Missing Content-Type Header with Request Body (Phase 1)
#
# -=[ Rule Logic ]=-
# This rule checks if the Content-Length header value is non-zero (indicating
# the client declares a body is present), then verifies the existence of the
# Content-Type header. While RFCs do not mandate a Content-Type header for all
# requests, its absence in requests with a body is a strong indication of a
# non-compliant browser or an evasion attempt.
#
# Omitting the Content-Type header allows bypassing the Request Body Processor
# unless you set the optional tx.enforce_bodyproc_urlencoded variable. This can
# be used to evade detection by preventing proper parsing of XML, JSON, or other
# body formats.
#
# This rule operates in phase:1 (request headers) based on the Content-Length
# header declaration. A complementary rule (920640) operates in phase:2 based
# on the actual REQUEST_BODY_LENGTH to catch cases where the body is present
# but Content-Length was omitted or set to zero.
#
# -=[ References ]=-
# https://httpwg.org/specs/rfc7231.html#header.content-type
# https://httpwg.org/specs/rfc7230.html#header.content-length