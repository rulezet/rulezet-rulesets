SecRule REQUEST_HEADERS:Content-Type "!@rx ^[\w/.+*-]+(?:\s?;\s*(?:action|boundary|charset|component|start(?:-info)?|type|version)\s?=\s?['\"\w.()+,/:=?<>@#*-]+)*$"      "id:920470,     phase:1,     block,     t:none,t:lowercase,     msg:'Illegal Content-Type header',     logdata:'%{MATCHED_VAR}',     tag:'application-multi',     tag:'language-multi',     tag:'platform-multi',     tag:'attack-protocol',     tag:'paranoia-level/1',     tag:'OWASP_CRS',     tag:'OWASP_CRS/PROTOCOL-ENFORCEMENT',     tag:'capec/1000/255/153',     ver:'OWASP_CRS/4.26.0-dev',     severity:'CRITICAL',     setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# In case Content-Type header can be parsed, check the mime-type against
# the policy defined in the 'allowed_request_content_type' variable.
# To change your policy, edit crs-setup.conf and activate rule 900220.