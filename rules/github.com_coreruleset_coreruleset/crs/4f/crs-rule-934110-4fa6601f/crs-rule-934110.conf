SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* "@pmFromFile ssrf.data"      "id:934110,     phase:2,     block,     capture,     t:none,     msg:'Possible Server Side Request Forgery (SSRF) Attack: Cloud provider metadata URL in Parameter',     logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',     tag:'application-multi',     tag:'language-multi',     tag:'platform-multi',     tag:'attack-ssrf',     tag:'paranoia-level/1',     tag:'OWASP_CRS',     tag:'OWASP_CRS/ATTACK-GENERIC',     tag:'capec/1000/225/664',     ver:'OWASP_CRS/4.26.0-dev',     severity:'CRITICAL',     setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',     setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# This rule detects SSRF attempts using hostnames without schemes.
# Some frameworks and libraries add implicit 'http://' or 'https://' schemes
# when processing URLs, making scheme-less hostnames effective attack vectors.
#
# Examples:
# - localhost/
# - host.docker.internal/
# - kubernetes.default.svc.cluster.local/