SecRule TX:DETECTION_PARANOIA_LEVEL "@ge 4"      "id:949155,     phase:1,     pass,     t:none,     nolog,     tag:'OWASP_CRS',     ver:'OWASP_CRS/4.26.0-dev',     setvar:'tx.detection_inbound_anomaly_score=+%{tx.inbound_anomaly_score_pl4}'"

# at start of phase 2, we reset the aggregate scores to 0 to prevent duplicate counting of per-PL scores
# this is necessary because the per-PL scores are counted across phases
SecAction      "id:949059,     phase:2,     pass,     t:none,     nolog,     tag:'OWASP_CRS',     ver:'OWASP_CRS/4.26.0-dev',     setvar:'tx.blocking_inbound_anomaly_score=0'"

SecAction      "id:949159,     phase:2,     pass,     t:none,     nolog,     tag:'OWASP_CRS',     ver:'OWASP_CRS/4.26.0-dev',     setvar:'tx.detection_inbound_anomaly_score=0'"

# Summing up the blocking and detection anomaly scores in phase 2