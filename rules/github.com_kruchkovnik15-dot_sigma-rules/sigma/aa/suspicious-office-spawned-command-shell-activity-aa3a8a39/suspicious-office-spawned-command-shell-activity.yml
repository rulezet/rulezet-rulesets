title: Suspicious Office Spawned Command Shell Activity

id: 52dbdf73-c7d7-4f2e-b56e-fc4f66c5f981

status: stable

description: Detects Microsoft Office applications spawning cmd.exe with command-line patterns associated with payload execution, LOLBins abuse, script execution, reconnaissance, or malware delivery.

author: Nikolai Kruchkov

date: 2026-06-02

references:
  - https://attack.mitre.org/techniques/T1204/
  - https://attack.mitre.org/techniques/T1059/003/
  - https://lolbas-project.github.io/

logsource:
  product: windows
  category: process_creation

detection:

  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'

  selection_child:
    Image|endswith:
      - '\cmd.exe'

  selection_suspicious:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'certutil'
      - 'bitsadmin'
      - 'curl'
      - 'wget'
      - 'mshta'
      - 'regsvr32'
      - 'rundll32'
      - 'whoami'
      - 'net user'
      - 'net group'
      - 'nltest'
      - 'dsquery'
      - 'ipconfig'
      - 'tasklist'

  condition: selection_parent and selection_child and selection_suspicious

falsepositives:
  - Administrative automation
  - Approved Office integrations
  - Enterprise software deployment workflows

level: high

tags:
  - attack.execution
  - attack.t1059.003
  - attack.initial_access
  - attack.discovery