title: ProcDump LSASS Memory Damping
id: 9a8a6411-e407-42c2-bc32-15f1624bbfd2
status: test
description: Detects process dumping of LSASS memory using ProcDump.
author: Security Analyst
references:
    - https://mitre.org
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\procdump.exe'
        CommandLine|contains: 'lsass'
    condition: selection
falsepositives:
    - Legitimate administrative troubleshooting or memory profiling.
level: high
tags:
    - attack.credential_access
    - attack.t1003.001