title: Suspicious PowerShell Encoded Command or In-Memory Download
id: 9d3a7c41-2b6f-4e85-a1c9-7f4d8e2b3650
status: experimental
description: |
  Detects PowerShell process creation with command-line patterns associated
  with obfuscation and fileless execution: encoded commands (-EncodedCommand),
  hidden windows, execution-policy bypass, and in-memory download cradles
  (DownloadString / IEX). These are common in initial access and execution
  stages of commodity malware and post-exploitation frameworks.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Damir Sadikov
date: 2026/05/28
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - '-enc '
      - '-EncodedCommand'
      - '-e '
  selection_download:
    CommandLine|contains|all:
      - 'DownloadString'
      - 'IEX'
  selection_flags:
    CommandLine|contains|all:
      - '-nop'
      - '-w hidden'
  condition: selection_img and (selection_encoded or selection_download or selection_flags)
fields:
  - ParentImage
  - CommandLine
  - User
falsepositives:
  - Legitimate administrative or deployment scripts using encoded commands.
  - Software installers that wrap PowerShell — baseline before enabling.
level: medium